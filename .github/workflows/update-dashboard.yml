name: update-dashboard

on:
  schedule:
    # GitHub 的排程用 UTC 時間，台灣時間 = UTC + 8；實際執行常會延遲幾分鐘到半小時
    - cron: '17 7 * * 1-5'    # 台灣週一～五 15:17（收盤價、技術面、匯率）
    - cron: '17 10 * * 1-5'   # 台灣週一～五 18:17（本益比、傍晚新聞與公告）
    - cron: '47 13 * * 1-5'   # 台灣週一～五 21:47（法人、融資融券、晚間新聞、美國經濟數據）
    - cron: '47 22 * * 1-5'   # 台灣週二～六 06:47（前一個美股日）
    - cron: '37 23 * * 1-5'   # 台灣週二～六 07:37（備用，萬一 06:47 被延遲或漏跑）
  workflow_dispatch:           # 在 Actions 頁面可以手動按 Run workflow

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - run: pip install -r requirements.txt
      - name: 安裝瀏覽器（抓國發會景氣燈號的備用方法）
        run: pip install playwright && python -m playwright install --with-deps chromium
      - run: python dashboard.py --no-open --public --out site/index.html
        env:
          FINMIND_TOKEN: ${{ secrets.FINMIND_TOKEN }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      - uses: actions/upload-pages-artifact@v5
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
